# Deploy production khi có code mới trên main.
# Nếu chưa gắn secret RENDER_DEPLOY_HOOK thì bỏ qua (exit 0) — không làm đỏ pipeline.
name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy lên Render
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Deploy Hook (nếu có)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Chưa có secret RENDER_DEPLOY_HOOK — bỏ qua deploy."
            echo "Gắn hook: Render → astra-tarot-api → Settings → Deploy Hook"
            echo "rồi dán URL vào GitHub → Settings → Secrets → Actions."
            echo "Nhánh dịch vụ trên Render nên là main."
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook-body -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP $code"
          cat /tmp/hook-body || true
          case "$code" in
            2*) echo "Đã xếp hàng deploy trên Render." ;;
            *) echo "::error::Deploy Hook trả $code"; exit 1 ;;
          esac
