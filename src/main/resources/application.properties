spring.application.name=astra-tarot-web-be
# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/astra-tarot
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.jdbc=${JDBC_LOG_LEVEL:WARN}
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Server
# Render (va nhieu nen tang PaaS khac) khong cho chon cong: chung dat bien PORT
# roi doi ung dung nghe dung cong do. Nghe sai cong thi Render cho 90 giay,
# khong thay ai tra loi, rui bao "no open ports detected" va huy ban deploy.
# O may va tren VPS khong co bien PORT nen van la 8080.
server.port=${PORT:8080}

# Async request processing (SSE)
spring.mvc.async.request-timeout=300000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# App
# Dùng để dựng link trong mail xác minh và đặt lại mật khẩu. Chạy thật mà quên
# đặt biến này thì người dùng nhận mail có link trỏ về localhost — bấm vào
# không ra gì, và không ai kích hoạt được tài khoản.
app.frontend-url=${FRONTEND_URL:http://localhost:8081}

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

app.mail.from-email=${MAIL_FROM_EMAIL:astratarot.noreply@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Astra Tarot}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}

# Gemini
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.endpoint=${GEMINI_API_ENDPOINT}

# Redis Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis chạy thật có mật khẩu; ở máy dev để trống là đúng.
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
# Redis dam may (Upstash, Redis Cloud...) BAT BUOC TLS. Redis chay bang Docker o
# may hay tren VPS thi khong. De mac dinh false; dat REDIS_SSL_ENABLED=true khi
# dung dich vu dam may, neu khong ket noi bi tu choi ngay.
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=-1ms

# AI Chat - Token Budget Management
ai.chat.max-context-tokens=6000

# DEBUG in ra chi tiết uỷ quyền của TỪNG request. Ở máy dev thì tiện, trên VPS
# thì log phình rất nhanh và lộ cả đường dẫn lẫn quyền của người dùng.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# ---------- Nguồn được phép gọi API từ trình duyệt (CORS) ----------
# Mặc định là hai cổng dev. Chạy thật PHẢI đặt CORS_ALLOWED_ORIGINS thành đúng
# domain của FE trên Vercel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# ---------- Health check ----------
# Chỉ mở đúng endpoint health. Những endpoint actuator khác (env, beans,
# configprops) phơi nguyên biến môi trường và cấu hình ra ngoài.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# TẮT kiểm tra sức khoẻ máy chủ mail.
#
# Mặc định Spring gộp cả mail vào /actuator/health, nghĩa là MỖI lần Docker hay
# nginx hỏi "còn sống không" thì ứng dụng lại mở một kết nối tới smtp.gmail.com
# và đăng nhập. Hai hệ quả, đều đã gặp khi chạy thử bằng docker-compose.prod.yml:
#
#  1. Gmail chập một nhịp là container bị đánh dấu unhealthy, dù ứng dụng vẫn
#     phục vụ được mọi request. Sức khoẻ của trang không nên phụ thuộc vào việc
#     máy chủ mail của người khác có rảnh hay không.
#  2. Cứ 30 giây một lần đăng nhập SMTP, cả ngày. Gmail coi đó là hành vi đáng
#     ngờ và sẽ chặn.
#
# Postgres và Redis thì GIỮ NGUYÊN trong health check — thiếu chúng là ứng dụng
# hỏng thật.
management.health.mail.enabled=false
astro.encryption-key=${ASTRO_ENCRYPTION_KEY:${ASTRO_ENCRYPTION_KEY_DEFAULT:}}
# Upload file (hiện chỉ có avatar)
# Thư mục lưu trên đĩa máy chủ; production nhiều instance thì phải đổi sang
# object storage vì mỗi instance có đĩa riêng.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

# ---------- Tài khoản nhận chuyển khoản ----------
# Khách chuyển tiền vào đây với nội dung là mã tham chiếu; người trực đối soát
# sao kê rồi xác nhận ở /admin/payments. Phải đặt giá trị thật trước khi chạy
# thương mại — để mặc định thì màn thanh toán hiện "Chưa cấu hình".
app.bank.name=${BANK_NAME:Chưa cấu hình}
app.bank.account-number=${BANK_ACCOUNT_NUMBER:Chưa cấu hình}
app.bank.account-holder=${BANK_ACCOUNT_HOLDER:Chưa cấu hình}

# ---------- Chạy sau nginx ----------
# Không có dòng này thì Spring chỉ thấy request http nội bộ từ nginx và dựng
# link chuyển hướng bằng http, dù người dùng vào bằng https.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NATIVE}
