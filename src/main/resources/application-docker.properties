# Database - Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/astra-tarot
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.jdbc=${JDBC_LOG_LEVEL:WARN}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Cache
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=-1ms

server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# App
#app.frontend-url=${FRONTEND_URL:http://localhost:8081}
app.frontend-url=http://localhost:8081

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

app.mail.from-email=${MAIL_FROM_EMAIL:astratarot.noreply@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Astra Tarot}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.endpoint=${GEMINI_API_ENDPOINT}
spring.cache.type=none

logging.level.org.springframework.security=DEBUG
astro.encryption-key=${ASTRO_ENCRYPTION_KEY}