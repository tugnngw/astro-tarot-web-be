# ============================================================
# Hồ sơ cấu hình chạy thật trên VPS (SPRING_PROFILES_ACTIVE=prod).
#
# application.properties đã lấy gần hết giá trị từ biến môi trường, nên file này
# chỉ chứa những gì KHÁC khi chạy thật. Mọi bí mật vẫn nằm ở .env trên VPS,
# tuyệt đối không viết thẳng vào đây — file này được commit lên git.
# ============================================================

# ---------- Redis ----------
# Redis trên VPS có mật khẩu (xem docker-compose.prod.yml). Thiếu dòng này thì
# ứng dụng nối tới Redis mà không xác thực và bị từ chối: đăng nhập hỏng ngay,
# vì bộ đếm chống dò mật khẩu (AuthRateLimitFilter) đọc Redis trên mọi lần gọi
# /auth. Bộ nhớ đệm bản đồ sao và mã đổi OAuth cũng dùng Redis.
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ---------- Tắt trang tài liệu API ----------
# SecurityConfig cho /swagger-ui/** và /v3/api-docs/** đi qua không cần đăng
# nhập — tiện lúc làm, nhưng chạy thật thì đó là bản đồ đầy đủ mọi endpoint,
# mọi tham số, phơi cho bất kỳ ai ghé qua. Tắt ở đây thì hai đường dẫn đó trả
# 404, khỏi phải sửa SecurityConfig.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------- Không rò rỉ chi tiết lỗi ra ngoài ----------
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Ẩn dòng "Whitelabel Error Page" kèm tên máy chủ.
server.error.whitelabel.enabled=false

# ---------- Không lộ phiên bản máy chủ ----------
# Mặc định Tomcat gắn "Server: Apache-Tomcat/x.y.z" vào mọi phản hồi, chỉ giúp
# ích cho người đang dò xem nên thử lỗ hổng nào.
server.server-header=

# ---------- Flyway ----------
# Chạy migration lúc khởi động. baseline-on-migrate cho phép áp lên một CSDL đã
# có sẵn bảng mà chưa có bảng lịch sử flyway.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
