# ============================================================
# Hồ sơ cấu hình chạy thật trên VPS (SPRING_PROFILES_ACTIVE=prod).
#
# application.properties đã lấy gần hết giá trị từ biến môi trường, nên file này
# chỉ chứa những gì KHÁC khi chạy thật. Mọi bí mật vẫn nằm ở .env trên VPS,
# tuyệt đối không viết thẳng vào đây — file này được commit lên git.
# ============================================================

# ---------- Redis ----------
# Redis trên VPS có mật khẩu (xem docker-compose.prod.yml). Thiếu dòng này thì
# ứng dụng nối tới Redis mà không xác thực và bị từ chối: đăng nhập hỏng ngay,
# vì bộ đếm chống dò mật khẩu (AuthRateLimitFilter) đọc Redis trên mọi lần gọi
# /auth. Bộ nhớ đệm bản đồ sao và mã đổi OAuth cũng dùng Redis.
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ---------- Tắt trang tài liệu API ----------
# SecurityConfig cho /swagger-ui/** và /v3/api-docs/** đi qua không cần đăng
# nhập — tiện lúc làm, nhưng chạy thật thì đó là bản đồ đầy đủ mọi endpoint,
# mọi tham số, phơi cho bất kỳ ai ghé qua. Tắt ở đây thì hai đường dẫn đó trả
# 404, khỏi phải sửa SecurityConfig.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------- Không rò rỉ chi tiết lỗi ra ngoài ----------
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Ẩn dòng "Whitelabel Error Page" kèm tên máy chủ.
server.error.whitelabel.enabled=false

# ---------- Không lộ phiên bản máy chủ ----------
# Mặc định Tomcat gắn "Server: Apache-Tomcat/x.y.z" vào mọi phản hồi, chỉ giúp
# ích cho người đang dò xem nên thử lỗ hổng nào.
server.server-header=

# ---------- Phép dò sống/chết cho Render ----------
# Render gọi đường health và chỉ chờ 5 giây. /actuator/health mặc định còn
# hỏi Postgres (Neon) và Redis (Upstash). Neon vừa ngủ dậy, hoặc Redis bắt
# tay TLS chậm một nhịp, là quá 5 giây. Render coi instance chết và khởi
# động lại. App Java chưa nghe cổng thì lượt sau cũng hết giờ, thành vòng
# lặp: request treo không một byte, Keep warm nhận timeout hoặc lỗi 520.
# Hai thành phần ấy vẫn bắt buộc lúc chạy việc thật, nhưng không được nằm
# trong phép dò. Liveness chỉ cần trả lời tiến trình còn nhận request.
management.health.db.enabled=false
management.health.redis.enabled=false

# ---------- Flyway ----------
# Chạy migration lúc khởi động. baseline-on-migrate cho phép áp lên một CSDL đã
# có sẵn bảng mà chưa có bảng lịch sử flyway.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---------- Chịu được cú đứt kết nối lúc khởi động ----------
# Chỗ đứt nằm ở đường mạng Render -> pooler Supabase, không phải ở cấu hình.
#
# Đo được: từ máy làm việc, và từ đúng image eclipse-temurin:21-jre-alpine với
# đúng bộ cờ JVM của Dockerfile này, 8/8 lần bắt tay TLS tới
# aws-0-ap-southeast-1.pooler.supabase.com đều xong sạch. Trên Render thì hai
# lần liên tiếp chết ở hai chỗ KHÁC NHAU — một lần "Remote host terminated the
# handshake", một lần "Broken pipe" — và nhật ký Supavisor không ghi nhận lần
# nào trong hai lần đó. Kết nối bị cắt trước khi tới được pooler.
#
# Hai lỗi khác nhau ở hai lần liền nhau là dấu hiệu chập chờn, không phải chặn.
# Nhưng mặc định thì một cú chập giết cả tiến trình: Flyway xin kết nối, trượt
# một lần là ném lỗi, entityManagerFactory không dựng được, Spring tắt, Render
# dựng lại từ đầu — mỗi vòng hơn một phút, và vòng sau cũng chỉ có đúng một cơ
# hội như vòng trước.
#
# Xin lại 10 lần, cách nhau 5 giây. Tổng chừng một phút, vẫn ngắn hơn một vòng
# dựng lại của Render, và đổi lại là đi qua được cú chập.
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5s

# Hikari cũng fail-fast theo mặc định: mở không được kết nối đầu tiên là ném.
# Cho nó kiên nhẫn 60 giây rồi hẵng bỏ cuộc.
spring.datasource.hikari.initialization-fail-timeout=60000

# Pool 5 thay cho mặc định 10. Hộp 512 MB không phục vụ nổi 10 truy vấn song
# song, và pooler dùng chung của gói free chỉ có 60 chỗ cho cả dự án.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Pooler cắt kết nối rỗi mà không báo. keepalive đụng nhẹ vào từng kết nối
# trong pool mỗi hai phút, để phát hiện kết nối đã chết trước khi một request
# thật vớ phải nó và trả 500.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1200000
