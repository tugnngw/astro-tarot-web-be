# ============================================================
# Bản thiết kế cho Render (Blueprint).
#
# Chỉ dựng backend. Postgres lấy ở Neon, Redis lấy ở Upstash — KHÔNG dùng
# Postgres free của Render vì nó bị xoá sau 30 ngày.
#
# Cách dùng: Render Dashboard → New → Blueprint → trỏ vào repo này.
# Hoặc dựng tay bằng New → Web Service, chọn Docker, rồi điền biến môi trường
# theo danh sách bên dưới.
# ============================================================

services:
  - type: web
    name: astra-tarot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main

    # Render gọi đường dẫn này để biết ứng dụng đã sẵn sàng chưa.
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---------- Ghì JVM lại cho vừa 512 MB ----------
      # Bản free chỉ có 512 MB. JVM mặc định nhìn thấy bộ nhớ container rồi tự
      # đặt heap tối đa bằng 25% — nghe thì an toàn, nhưng nó còn cộng thêm
      # metaspace, stack của từng luồng và bộ nhớ ngoài heap, nên tổng vẫn vượt
      # 512 MB và bị hệ điều hành giết giữa chừng.
      #
      # SerialGC thay vì G1: G1 giữ sẵn vài chục MB cấu trúc nội bộ, thừa thãi
      # với một tiến trình nhỏ chạy một nhân CPU.
      - key: JAVA_TOOL_OPTIONS
        # CẬP NHẬT: giá trị cũ là MaxRAMPercentage=65 với MaxMetaspaceSize=128m,
        # và chính nó làm ứng dụng ném OutOfMemoryError: Metaspace giữa lúc phục
        # vụ request. Giới hạn THẬT giờ nằm ở ENTRYPOINT của Dockerfile vì cờ
        # dòng lệnh ghi đè biến này; giữ ở đây cho khớp để hai nơi đừng nói hai
        # chuyện khác nhau.
        value: "-XX:MaxRAMPercentage=35 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=192m"

      # ---------- Chạy sau proxy của Render ----------
      # Phải là FRAMEWORK, không phải NATIVE. NATIVE để Tomcat xử lý, mà Tomcat
      # chỉ tin X-Forwarded-* khi proxy nằm trong dải IP nội bộ; proxy của Render
      # thì không. Hệ quả: Spring tưởng request đến bằng http và dựng link xác
      # minh email sai giao thức.
      - key: FORWARD_HEADERS_STRATEGY
        value: FRAMEWORK

      # ---------- Postgres ----------
      #
      # MỘT bộ thông tin kết nối duy nhất. Trước đây có thêm SPRING_FLYWAY_URL,
      # SPRING_FLYWAY_USER và SPRING_FLYWAY_PASSWORD, và tài liệu ghi rõ chúng
      # "giống hệt" ba biến trên — tức là ba biến thừa phải nhớ chép lại mỗi
      # lần đổi cơ sở dữ liệu.
      #
      # Nó đã hỏng đúng theo cách dự đoán được: khi chuyển sang cơ sở dữ liệu
      # mới, ba biến của datasource được cập nhật còn ba biến của Flyway thì
      # không, nên ứng dụng trỏ một nơi mà Flyway trỏ nơi khác. Deploy chết ở
      # bước Flyway, và thông báo lỗi nói về TLS chứ không nói về cấu hình —
      # nên rất khó lần ra.
      #
      # Bỏ hẳn ba biến ấy đi thì Flyway dùng lại datasource của ứng dụng (mặc
      # định của Spring Boot), và không còn hai nơi để lệch nhau nữa.
      #
      # Chuỗi JDBC PHẢI giữ ?sslmode=require.
      #
      # Supabase: dùng host POOLER (aws-0-<region>.pooler.supabase.com, cổng
      # 5432 cho session pooler), KHÔNG dùng db.<ref>.supabase.co — host đó chỉ
      # có bản ghi IPv6, mà Render gói free không có IPv6. Tên đăng nhập phải
      # là postgres.<project-ref>, không phải postgres trần: pooler dựa vào
      # phần đuôi ấy để biết định tuyến tới dự án nào.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # application.properties còn một chỗ viết ${DB_PASSWORD} trần.
      - key: DB_PASSWORD
        sync: false

      # ---------- Redis ở Upstash ----------
      # Upstash Console → Details → Endpoint và Password.
      # REDIS_PORT thường là 6379; TLS thì bắt buộc.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"

      # ---------- Domain của FE trên Vercel ----------
      # Sai một trong hai là hỏng lặng lẽ:
      #  - FRONTEND_URL dựng link trong mail xác minh / đặt lại mật khẩu
      #  - CORS_ALLOWED_ORIGINS quyết định trình duyệt có cho gọi API không
      # Không có dấu / ở cuối.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ---------- Chống bot ở màn đăng nhập / đăng ký ----------
      # Secret key của widget Turnstile "astrotarot-auth" (Cloudflare →
      # Turnstile). ĐỂ TRỐNG LÀ TẮT tính năng, không phải là chặn hết — xem
      # TurnstileService để biết vì sao chọn như vậy.
      - key: TURNSTILE_SECRET
        sync: false

      # ---------- Khoá bí mật ----------
      # generateValue: Render tự sinh chuỗi ngẫu nhiên ở lần dựng đầu rồi giữ
      # nguyên. Đổi JWT_SECRET là mọi người đang đăng nhập bị đăng xuất.
      - key: JWT_SECRET
        generateValue: true
      # KHÔNG để Render tự sinh khoá này: nó phải là base64 của ĐÚNG 32 byte,
      # và đổi khoá sau khi đã có dữ liệu là không giải mã lại được nữa.
      # Tự sinh bằng: openssl rand -base64 32
      - key: ASTRO_ENCRYPTION_KEY
        sync: false

      # ---------- Gửi mail ----------
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Astra Tarot

      # ---------- Tuỳ chọn ----------
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_ENDPOINT
        sync: false
      - key: BANK_BIN
        value: "970436"
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ACCOUNT_HOLDER
        sync: false
      - key: SECURITY_LOG_LEVEL
        value: WARN
