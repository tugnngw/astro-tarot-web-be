# ============================================================
# nginx đứng trước backend trên VPS.
#
# Hai việc: kết thúc TLS, và chuyển tiếp về backend qua mạng nội bộ Docker.
# Backend không mở cổng ra ngoài, nên đây là đường duy nhất vào.
#
# Thay api.ten-mien-cua-ban.com bằng domain thật ở CẢ BỐN chỗ bên dưới.
# ============================================================

# ---------- HTTP: chỉ để xin chứng chỉ và đẩy sang HTTPS ----------
server {
    listen 80;
    server_name api.ten-mien-cua-ban.com;

    # Certbot đặt file thử thách ở đây. Phải để TRƯỚC lệnh redirect, nếu không
    # certbot bị đẩy sang https và không xin nổi chứng chỉ đầu tiên.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.ten-mien-cua-ban.com;

    ssl_certificate     /etc/letsencrypt/live/api.ten-mien-cua-ban.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ten-mien-cua-ban.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Ảnh đại diện có thể vài MB; mặc định của nginx là 1MB và sẽ trả 413.
    client_max_body_size 10M;

    # KHÔNG thêm header CORS ở đây. Spring đã trả rồi; nginx thêm nữa thành hai
    # header trùng tên và trình duyệt từ chối cả hai.

    # Nén phản hồi JSON. Danh sách Reader hay danh mục sản phẩm là JSON thuần,
    # nén xuống còn khoảng một phần năm — đáng kể với người dùng mạng di động.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
    # Mọi phản hồi ở đây đều đi qua proxy, nên PHẢI bật cho luồng proxy —
    # để mặc định (off) là gzip không bao giờ chạy.
    gzip_proxied any;
    # Luồng trả lời dần của AI mang kiểu text/event-stream. Kiểu đó cố tình
    # không có trong gzip_types ở trên: nén sẽ giữ lại từng khúc trong bộ đệm
    # và phá mất hiệu ứng chữ hiện dần.

    # Vài header cứng rẻ tiền.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Phân giải tên container bằng DNS nội bộ của Docker, ngay lúc có request.
    #
    # Viết thẳng proxy_pass http://backend:8080 thì nginx phân giải tên đó NGAY
    # LÚC KHỞI ĐỘNG và chết hẳn với "host not found in upstream" nếu chưa có
    # container backend. Hệ quả: backend sập một lần là nginx cũng không dựng
    # lại nổi, và cả trang chết theo thay vì trả 502 rồi tự lành.
    #
    # 127.0.0.11 là DNS mà Docker gắn sẵn cho mọi container.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_backend http://backend:8080;

    # STOMP over WebSocket — cần Upgrade; timeout dài vì kết nối giữ lâu.
    location /ws {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Thiếu dòng này thì Spring tưởng request đến bằng http và dựng link
        # chuyển hướng sai giao thức.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Trải bài bằng AI chạy lâu; mặc định 60 giây của nginx sẽ cắt giữa chừng.
        # Khớp với spring.mvc.async.request-timeout=300000.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Cần cho luồng phản hồi từng phần của AI (SSE) — đệm lại thì người dùng
        # ngồi nhìn màn hình trống tới khi xong.
        proxy_buffering off;
    }
}
